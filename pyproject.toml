[project]
name = "fhir-extract"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "fhir.resources>=8.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "orjson>=3.10",
    "typer>=0.12",
    "openai>=1.40",
]

[project.optional-dependencies]
gpu = ["torch>=2.4", "transformers>=4.44", "peft>=0.12", "trl>=0.10",
       "bitsandbytes>=0.43", "accelerate>=0.33", "datasets>=2.20",
       "vllm>=0.6", "wandb>=0.17"]
serve = ["fastapi>=0.112", "uvicorn>=0.30"]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6", "httpx>=0.27"]  # httpx: FastAPI TestClient in tests/test_serve.py

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Pinned so `make lint` means the same thing on every ruff version: newer
# releases widened the default rule set, which turned a clean tree red overnight.
select = ["E", "F", "W"]
ignore = ["E501"]
