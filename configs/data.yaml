seed: 42
synthea:
  population: 3000
  output_dir: data/raw/synthea
generation:
  backend: openai            # openai | vllm
  model: Qwen/Qwen3-8B       # must match the id from GET <base_url>/models
  base_url: http://10.24.6.107:8003/v1
  api_key: EMPTY
  structured_output_mode: json_schema
  enable_thinking: false
  max_concurrency: 8
  timeout: 120
  temperature: 0.9
  top_p: 0.95
  max_tokens: 1024
  target_pairs: 24000        # over-generate ~3x; filter down to ~8000
  batch_size: 64
splits:
  train: 8000
  val: 500
  test_synthetic: 500
paths:
  interim: data/interim
  processed: data/processed
