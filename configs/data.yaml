seed: 42
synthea:
  population: 3000
  output_dir: data/raw/synthea
generation:
  backend: openai            # openai | vllm
  model: Qwen/Qwen3-8B       # must match the id from GET <base_url>/models
  base_url: http://10.24.6.107:8003/v1
  api_key: EMPTY
  structured_output_mode: json_schema
  enable_thinking: false
  # vLLM serves 256 concurrent by default and was measured at Running:8 /
  # Waiting:0 / KV-cache 2.7% -- i.e. starved by this client, not busy. Decode
  # on an 8B is memory-bandwidth-bound, so batch 64 reads the same 16GB of
  # weights per step as batch 8 and yields ~8x the tokens.
  max_concurrency: 64
  timeout: 300              # per-request latency rises with queue depth
  temperature: 0.9
  top_p: 0.95
  max_tokens: 1024
  target_pairs: 25000        # over-generate ~3x; filter down to ~8000
  # Which slice of the corpus this pass draws from: vitals | no_vitals |
  # allergies. Passes are cumulative -- generate.py skips encounters already
  # in pairs.jsonl, so raise target_pairs and re-run to append a pass.
  #   pass 1  vitals     target 25000  (the main corpus)
  #   pass 2  allergies  target 25600  (whole pool is only ~630 encounters)
  #   pass 3  no_vitals  target 28600  (vitals-absent negatives)
  encounter_filter: vitals
  # Checkpoint granularity, NOT concurrency. complete() blocks until the whole
  # chunk returns, so a chunk equal to max_concurrency drains the pool to 1
  # request at every tail. Keeping it several times larger keeps the pool fed
  # and amortises that barrier; a crash costs at most one chunk (resumable).
  batch_size: 512
inference:                   # used by eval.py's LLM baselines (--system llm)
  backend: openai
  model: Qwen/Qwen3-8B
  base_url: http://10.24.6.107:8003/v1
  api_key: EMPTY
  structured_output_mode: json_schema
  enable_thinking: false
  max_concurrency: 64       # same endpoint as generation; see that block
  timeout: 300
splits:
  train: 8000              # NOT a cap -- train is the overflow bucket
  val: 500
  test_synthetic: 500
  # Enriched AllergyIntolerance slice, held out separately so test_synthetic
  # stays distribution-faithful. Counted in allergy-labelled rows, not total.
  #
  # Sized against the CEILING, not against what makes a comfortable test set:
  # Synthea yields 634 allergy encounters corpus-wide (one per patient), which
  # survive subsetting and faithfulness filtering as ~165 labelled rows. At 150
  # the slice consumed 91% of them and left 15 to train on. 60 leaves ~105 for
  # training -- both halves thin, which is the honest position for this
  # resource type and must be reported with n rather than as a bare F1.
  test_allergies: 60
paths:
  interim: data/interim
  processed: data/processed
