name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # CPU-only: training and vLLM serving need a GPU and are not exercised
      # here. The suite covers data generation, faithfulness filtering,
      # metrics, prompts, parsing and the serving API with a stubbed backend.
      - name: Install
        run: pip install -e ".[serve,dev]"

      - name: Lint
        run: ruff check src tests scripts

      - name: Tests
        run: pytest -q --cov=fhir_extract --cov-report=term
